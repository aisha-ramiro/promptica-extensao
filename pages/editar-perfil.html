<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Perfil</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/editar-perfil.css">
</head>
<body>
  <header class="topbar">
    <button id="backConta" class="back-btn">&lt;</button>
    <h1 class="title">Editar Perfil</h1>

  </header>

  <form class="form-box">
    <div class="row2">
      <div><label>Nome</label><input id="nomeInput" type="text" placeholder="Digite seu nome"></div>
      <div><label>Sobrenome</label><input id="sobrenomeInput" type="text" placeholder="Digite seu sobrenome"></div>
    </div>
    <label>E-mail</label><input id="emailInput" type="email" placeholder="Seu e-mail" readonly>
    <label>Data de Nascimento</label><input id="nascimentoInput" type="date">
    <label>Celular</label><input id="celularInput" type="text" placeholder="(11) 99999-9999">
    <label>Senha</label><input id="senhaInput" type="password" placeholder="Nova senha">
    <button type="submit" class="primary-btn">Atualizar</button>
  </form>

  <script src="../config.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/editar-perfil.js"></script>
</body></html>
