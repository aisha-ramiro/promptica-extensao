<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Login – Promptica</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
  <!-- HEADER -->
  <header class="topbar">
    <button id="backHome" class="back-btn">&lt;</button>
    <h1 class="title">Login</h1>
  </header>

  <!-- FORM -->
<div class="login-box">
  <div class="form-box">
    <p id="loginStatus" class="text-center"></p>

    <div class="do-login">
      <img width="50" height="50" src="https://img.icons8.com/ios/50/horizontal-line.png" alt="horizontal-line"/>
      <p>Faça login para continuar</p>
      <img width="50" height="50" src="https://img.icons8.com/ios/50/horizontal-line.png" alt="horizontal-line"/>
    </div>

    <input id="loginEmail" type="email" placeholder="Endereço de e-mail">
    <input id="loginSenha" type="password" placeholder="Senha">

    <div class="row-between">
      <div class="connect"><label><input type="checkbox" id="staySigned"> Mantenha conectado</label></div>
      <a href="#" class="link">Esqueceu a senha?</a>
    </div>

    <button id="btnEntrar" class="primary-btn">Entrar</button>

    <p class="small">Não possui conta? <a id="goCadastro" href="cadastro.html">Cadastrar-se</a></p>
</div>

</div>

  <script src="../config.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/login.js"></script>

</body></html>
